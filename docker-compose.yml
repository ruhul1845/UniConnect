services:
  uniconnect:
    build:
      context: .
      args:
        REACT_APP_SUPABASE_URL: ${REACT_APP_SUPABASE_URL}
        REACT_APP_SUPABASE_ANON_KEY: ${REACT_APP_SUPABASE_ANON_KEY}
    image: uniconnect-raas:latest
    container_name: uniconnect_raas
    ports:
      - "3004:80"        # Team RAAS unique port — other teams use 3001/3002/3003
    restart: unless-stopped
